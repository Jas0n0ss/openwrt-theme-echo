name: Build IPK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gettext binutils

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < ucode/template/themes/echo/version)" >> "$GITHUB_OUTPUT"

      - name: Build IPK packages
        run: ./scripts/build-ipk.sh

      - name: Verify package contents
        run: chmod +x ./scripts/verify-ipk.sh && ./scripts/verify-ipk.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-echo-ipk-${{ github.sha }}
          path: |
            dist/luci-theme-echo_${{ steps.ver.outputs.version }}-1_all.ipk
            dist/luci-app-echo-config_${{ steps.ver.outputs.version }}-1_all.ipk
          retention-days: 30

      - name: Prepare release assets
        if: github.event_name != 'pull_request'
        run: |
          rm -rf release
          mkdir -p release
          cp "dist/luci-theme-echo_${{ steps.ver.outputs.version }}-1_all.ipk" release/
          cp "dist/luci-app-echo-config_${{ steps.ver.outputs.version }}-1_all.ipk" release/
          ls -lh release/

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Echo Theme ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          files: release/*.ipk
          body: |
            ## 安装

            上传到路由器后执行：

            ```sh
            opkg install luci-theme-echo_*.ipk
            opkg install luci-app-echo-config_*.ipk
            uci set luci.main.mediaurlbase='/luci-static/echo'
            uci commit luci
            /etc/init.d/uhttpd restart
            ```

            语言：**System → Language and Style → Language** → 简体中文 (zh_Hans)

            主题：**System → Language and Style → Design** → **Echo**

            Built from commit ${{ github.sha }}.

      - name: Remove auto-generated source archives
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}"
          release_id="$(gh release view "$tag" --json id -q .id)"
          gh api "repos/${{ github.repository }}/releases/${release_id}/assets" --paginate \
            --jq '.[] | select(.name | test("^(Source code|.*\\.tar\\.gz$|.*\\.zip$)"; "i")) | select(.name | test("\\.ipk$") | not) | .id' \
            | while read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset_id}" || true
            done
