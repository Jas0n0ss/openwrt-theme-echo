name: Build IPK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < ucode/template/themes/echo/version)" >> "$GITHUB_OUTPUT"

      - name: Build IPK packages
        run: ./scripts/build-ipk.sh

      - name: Verify package contents
        run: chmod +x ./scripts/verify-ipk.sh && ./scripts/verify-ipk.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-echo-ipk-${{ github.sha }}
          path: dist/*.ipk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Echo Theme ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            dist/luci-theme-echo_*.ipk
            dist/luci-app-echo-config_*.ipk
          body: |
            ## 安装

            上传到路由器后执行：

            ```sh
            opkg install luci-theme-echo_*.ipk
            opkg install luci-app-echo-config_*.ipk
            uci set luci.main.mediaurlbase='/luci-static/echo'
            uci commit luci
            /etc/init.d/uhttpd restart
            ```

            然后在 **System → Language and Style → Design** 中选择 **Echo**。

            Built from commit ${{ github.sha }}.
