name: Build IPK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < ucode/template/themes/echo/version)" >> "$GITHUB_OUTPUT"

      - name: Build IPK packages
        run: ./scripts/build-ipk.sh

      - name: Verify package contents
        run: chmod +x ./scripts/verify-ipk.sh && ./scripts/verify-ipk.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-packages
          path: dist/*.ipk
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built IPK packages
        uses: actions/download-artifact@v4
        with:
          name: ipk-packages
          path: dist

      - name: Prepare download site (IPK only)
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          mkdir -p site/v"${VERSION}" site/latest
          cp dist/*.ipk site/v"${VERSION}"/
          cp dist/*.ipk site/latest/
          echo "${VERSION}" > site/latest/VERSION.txt
          THEME=$(basename dist/luci-theme-echo_*.ipk)
          CONFIG=$(basename dist/luci-app-echo-config_*.ipk)
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Echo Theme Downloads</title></head><body>
          <h1>Echo Theme IPK Downloads</h1>
          <p>Version <strong>v${VERSION}</strong> — 仅包含 .ipk 安装包，无源码压缩包。</p>
          <h2>Latest</h2>
          <ul>
            <li><a href="latest/${THEME}">${THEME}</a></li>
            <li><a href="latest/${CONFIG}">${CONFIG}</a></li>
          </ul>
          <h2>v${VERSION}</h2>
          <ul>
            <li><a href="v${VERSION}/${THEME}">${THEME}</a></li>
            <li><a href="v${VERSION}/${CONFIG}">${CONFIG}</a></li>
          </ul>
          </body></html>
          HTML
          touch site/.nojekyll

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
          commit_message: "downloads: v${{ needs.build.outputs.version }}"
